name: kasflow
description: A simple cashbook app using Supabase
publish_to: "none"
version: 1.0.0+1
environment:
  sdk: ">=2.18.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  supabase_flutter: ^1.5.0
  image_picker: ^0.8.7
  path_provider: ^2.0.12
  intl: ^0.18.0
  uuid: ^3.0.6
  equatable: ^2.0.5  # Atau gunakan versi terbaru yang stabil
  flutter_bloc: ^8.1.3 # Pastikan ini juga ada jika Anda menggunakan Cubit

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
